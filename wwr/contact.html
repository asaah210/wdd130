<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting</title>
    <meta name="description"
      content="Contact White Water Rafting for information about our rafting adventures, reservations, and services.">
    <meta name="author" content="Asaah Lekara">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/rafting.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="box">
            <h2>Contact Information</h2>

            <p><strong>Address:</strong> 123 River Road, Adventure City</p>

            <p><strong>Phone:</strong> +1 555-123-4567</p>

            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=" width="600" height="300"
              loading="lazy">
            </iframe>
        </section>

        <section class="box">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Missionary" width="100" height="100">
                <figcaption>Missionary - Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Lekara" width="100" height="100">
                <figcaption>Lekara - Customer Service Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Sampson" width="100" height="100">
                <figcaption>sampson - Operations Manager</figcaption>
            </figure>
        </section>

        <section class="box">
            <h2>Send Us a Message</h2>

            <form>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message</legend>


                    <label>
                        <input type="radio" name="purpose" value="general">
                        General Inquiry
                    </label>


                    <label>
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>


                    <label>
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>

                </fieldset>

                <footer>
                    <p>© 2026 White Water Rafting | Asaah Lekara</p>

                    <nav class="socialmedia">
                        <a href="https://facebook.com">
                            <img src="images/facebook.svg" alt="Facebook">
                        </a>

                        <a href="https://twitter.com">
                            <img src="images/twitter.svg" alt="Twitter">
                        </a>

                        <a href="https://instagram.com">
                            <img src="images/instagram.svg" alt="Instagram">
                        </a>
                    </nav>
                </footer>

</body>

</html>OCTs
