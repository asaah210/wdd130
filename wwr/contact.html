<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting</title>

    <meta name="description"
      content="Contact White Water Rafting for company information, reservation questions, and rafting adventures. Meet our team and send us a message.">

    <meta name="author" content="Asaah Lekara">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>

        <h1>Contact Us</h1>

        <section class="company-info">
            <h2>Our Contact Information</h2>

            <p><strong>Address:</strong> 123 River Road, Adventure City</p>
            <p><strong>Phone:</strong> +234 800 123 4567</p>
            <p><strong>Email:</strong> info@whitewaterrafting.com</p>

            <iframe
              src="https://maps.google.com/maps?q=Port%20Harcourt%2C%20Nigeria&t=&z=13&ie=UTF8&iwloc=&output=embed"
              title="Map showing Port Harcourt, Nigeria" width="100%" height="300" loading="lazy">
            </iframe>
        </section>

        <section class="employee-profiles">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee1.jpg" alt="Portrait of our rafting manager">
                <figcaption>John Smith — Rafting Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Portrait of our rafting guide">
                <figcaption>Mary Johnson — Head Rafting Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg"
                  alt="Portrait of our customer service representative">
                <figcaption>David James — Customer Service Officer</figcaption>
            </figure>
        </section>

        <section class="contact-form-section">
            <h2>Send Us a Message</h2>

            <form action="#" method="get">

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name"
                  required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address"
                  required>

                <fieldset>
                    <legend>What is the purpose of your message?</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" placeholder="Write your message here..."
                  rows="6" required></textarea>

                <label for="subscribe">
                    <input type="checkbox" id="subscribe" name="subscribe" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 White Water Rafting | Asaah Lekara</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebooklg.png" alt="Facebook">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.svg.png" alt="Twitter">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
```
