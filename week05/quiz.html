<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Question 1</legend>
                <label for="q1">What does HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </fieldset>

            <fieldset>
                <legend>Question 2</legend>
                <label for="q2">Explain the purpose of CSS in web development.</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </fieldset>

            <fieldset>
                <legend>Question 3</legend>
                <label for="q3">Which HTML element is used to create a link?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="img">img</option>
                    <option value="a">a</option>
                    <option value="p">p</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Question 4</legend>
                <label for="q4">How many heading levels are available in HTML?</label>
                <input type="number" id="q4" name="q4">
            </fieldset>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>

</html>
